          JTEST_DB_HOST: 127.0.0.1
          JTEST_DB_NAME: proclaim_test
          JTEST_DB_USER: proclaim_test
          JTEST_DB_PASSWORD: proclaim_test
          JTEST_DB_PREFIX: proclaim_

  js-checks:
    name: JS Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  spellcheck:
    name: Spelling (user-facing text)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install codespell
        run: pip install codespell

      # Scope is English text users and contributors actually read. The
      # translated language files are deliberately excluded — codespell against
      # Czech or Hungarian is noise, and those files are generated from en-GB
      # by cwm-sync-languages anyway, so fixing the source fixes them.
      #
      # A typo here ships to every site's admin screen; "occured", "Commments",
      # "Resposive", "seperator", "Overide" and "Menue" all did exactly that
      # until 2026-07-27.
      #
      # Ignore list: SER is the key-prefix legend for Series in the ini
      # comments; pre-selected is legitimate English codespell would "fix".
      - name: Spellcheck en-GB strings and documentation
        run: >
          codespell
          --ignore-words-list ser,pre-selected
          admin/language/en-GB
          site/language/en-GB
          plugins/*/proclaim/language/en-GB
          modules/*/*/language/en-GB
          README.md CLAUDE.md build/*.md
