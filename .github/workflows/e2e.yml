# E2E against a disposable Joomla install (#1342).
#
# The browser and API suites always ran against hand-configured dev sites on
# one laptop, so between releases regressions accumulated unseen — the suite
# had rotted for months before the WCAG work revived it, and the REST API
# shipped broken three releases running because nothing installed the real
# package anywhere automatic.
#
# This job stands up everything from nothing: a MySQL service, a Joomla site
# installed headlessly by core's own CLI installer, the built pkg_proclaim
# zip deployed by the same `composer test:install` harness a release uses,
# and the Playwright suites driven against PHP's built-in server. No secrets,
# no persistent state, reproducible by any contributor's fork.
#
# It runs once per Joomla major. For a long time it ran only the API spec, so
# ten browser spec files executed on one developer's laptop and nowhere else
# — and the job reported green while they were failing there, which is worse
# than untested because a reviewer reasonably reads that green as coverage.
#
# Scheduled nightly (regressions surface within a day, not at release time),
# manually dispatchable, and run on pull requests that touch what it guards.

name: E2E

on:
  workflow_dispatch:
  schedule:
    # Nightly, 05:17 UTC — off the busy top-of-hour cron load.
    - cron: '17 5 * * *'
  pull_request:
    branches: [ "main", "development", "10.x", "11.0.0-dev" ]
    # ⚠️ No paths: filter, deliberately.
    #
    # This job was gated on an allow-list that grew by one entry each time it
    # silently failed to run: api/** missed the admin models the API executes
    # (#1754, #1755), then admin/sql/** (#1879), then composer.lock, then eight
    # build/ scripts the job invokes through test-install.sh (#1892). Five
    # incidents across two repositories, four of them found by someone noticing
    # an absent job in a checks list rather than by anything reporting it.
    #
    # An allow-list fails closed: anything nobody thought of skips, and a
    # skipped job is indistinguishable from a passing one. Measured over the
    # last 120 merges, the filter avoided 30 runs of a job that takes about
    # three minutes -- roughly 90 CI minutes saved in exchange for that.
    #
    # The nightly schedule above already ran everything the filter skipped, so
    # this does not make the job see more; it moves the failure from a
    # post-merge nightly on development to the pull request that caused it.
    # Four of the last 22 scheduled runs failed, which is what that costs
    # today.
    #
    # Joomla-Bible-Study/cwm-build-tools#129.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declared explicitly rather than relying on the repository default, so
# tightening that default later cannot silently take the monitoring away again.
# issues: write is granted on the notify job alone, which is the only one that
# writes — the matrix legs check out and run tests and need nothing more.
permissions:
  contents: read

env:
  SITE_DIR: /home/runner/joomla-site
  SITE_URL: http://127.0.0.1:8890

jobs:
  e2e:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One leg per Joomla major, because the two diverge and a failure on one
    # side is exactly what this matrix exists to catch: during the 10.7.0
    # release gate every servertype test failed on 5.4.7 and passed on 6.1.3
    # against identical code, and there was no CI signal either way.
    #
    # fail-fast is off so a broken J6 leg still reports the J5 result. A leg
    # that goes red tells you which Joomla it was from its own name.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'Package install + E2E (Joomla 5)'
            joomla: '5.4.3'
            props: j5dev
            # ⚠️ The J5 projects testIgnore the WCAG scans. That is the
            # config's own decision -- Proclaim renders the same markup on
            # both, so scanning twice costs a second full pass and reports
            # every violation twice -- and matrixing this way honours it
            # rather than overriding it here. The scans run on the J6 leg.
            projects: '--project=admin-j5 --project=site-j5'
          - label: 'Package install + E2E (Joomla 6)'
            joomla: '6.1.3'
            props: j6dev
            projects: '--project=admin-j6 --project=site-j6'

    env:
      JOOMLA_VERSION: ${{ matrix.joomla }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: joomla_ci
          MYSQL_DATABASE: joomla_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup PHP
        # 8.4, not Proclaim's 8.3 floor: this job builds the package, and that
        # means composer-installing plugins/content/scripturelinks, whose
        # composer.json requires php >=8.4. On 8.3 the install fails with "your
        # lock file does not contain a compatible set of packages".
        #
        # This is a build-time requirement only — the shipped extensions still
        # target 8.3, and ci.yml continues to lint and test on 8.3 and 8.5.
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json, xml, mysqli, zip, gd, intl, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --dev --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies and build assets
        # media/ is generated and gitignored; the package build zips it.
        run: |
          npm ci
          npm run build

      - name: Download and install Joomla ${{ env.JOOMLA_VERSION }}
        # Core's own CLI installer (4.3+) — the same install path a site
        # admin's web install runs, headless. The installation directory is
        # removed afterwards so Joomla serves the site, not the installer.
        run: |
          mkdir -p "$SITE_DIR"
          curl -sSL -o /tmp/joomla.zip \
            "https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.zip"
          unzip -q /tmp/joomla.zip -d "$SITE_DIR"
          php "$SITE_DIR/installation/joomla.php" install -n \
            --site-name="Proclaim CI" \
            --admin-user="CI Admin" \
            --admin-username=admin \
            --admin-password=admin1234567 \
            --admin-email=admin@example.com \
            --db-type=mysqli \
            --db-host=127.0.0.1 \
            --db-user=root \
            --db-pass=joomla_ci \
            --db-name=joomla_ci \
            --db-prefix=jos_ \
            --db-encryption=0
          rm -rf "$SITE_DIR/installation"
          # Pin the site URL. Under PHP's built-in server Joomla mis-derives
          # its root — admin pages emitted assets under /administrator/media/
          # and the login form POSTed to /administrator/administrator/ —
          # and $live_site is the supported way to stop it guessing.
          sed -i "s#public \$live_site = '';#public \$live_site = '${SITE_URL}';#" "$SITE_DIR/configuration.php"
          grep -n "live_site" "$SITE_DIR/configuration.php"
          # A fresh install auto-starts the "Welcome to Joomla!" guided tour
          # on first admin visit, and the tour JS navigates every page back
          # to its step-1 location (the dashboard) — which read exactly like
          # "all form views bounce to home" until the failure screenshot
          # showed the tour modal. No tours for a disposable site.
          mysql -h 127.0.0.1 -u root -pjoomla_ci joomla_ci \
            -e "UPDATE jos_extensions SET enabled = 0 WHERE folder = 'system' AND element = 'guidedtours';"
          # The admin dashboard's update quickicons call out to update.joomla.org
          # and to every registered update site — which, once test:install has
          # run, includes Proclaim's own on christianwebministries.org. Each of
          # those AJAX calls holds a dev-server worker for the length of an
          # internet round trip, so CI runs took a dependency on servers it does
          # not control and gets nothing in return: no test asserts on an update
          # count. Statistics reporting goes the same way — a disposable site
          # should not phone home either.
          mysql -h 127.0.0.1 -u root -pjoomla_ci joomla_ci -e "
            UPDATE jos_extensions SET enabled = 0
             WHERE (folder = 'quickicon'
                    AND element IN ('joomlaupdate','extensionupdate','autoupdate','downloadkey','eos'))
                OR (folder = 'system' AND element = 'stats');"

      - name: Write build.properties for the disposable site
        # The harness discovers the test site by role, not by name (#1353),
        # so this one file is the only wiring the whole chain needs.
        #
        # The browser projects are wired through the same file rather than
        # through anything CI-specific. playwright.config.js reads this leg's
        # baseURL from builder.<props>.url and global-setup.js authenticates
        # the site whose storageState the selected projects declare, so
        # pointing those keys at the disposable site is the entire change --
        # no CI branch in the Playwright config, which would be a second way
        # of doing what the property layer already does.
        run: |
          cat > build.properties <<EOF
          builder.installs=ci
          builder.ci.role=test
          builder.ci.path=${SITE_DIR}
          builder.ci.url=${SITE_URL}
          builder.ci.username=admin
          builder.ci.password=admin1234567
          builder.ci.email=admin@example.com
          builder.ci.version=${JOOMLA_VERSION}
          builder.${{ matrix.props }}.url=${SITE_URL}
          builder.${{ matrix.props }}.username=admin
          builder.${{ matrix.props }}.password=admin1234567
          EOF

      - name: Serve the site
        # Workers must exceed Chromium's 6-connections-per-host limit. At 4, a
        # page opening six parallel requests left two queued behind whichever
        # worker was slowest, and Playwright's `networkidle` — 500ms with no
        # in-flight request — could not reach its window inside the 30s
        # navigation timeout. That is the whole flake: an intermittent
        # "page.goto: Timeout 30000ms exceeded" on /administrator/index.php,
        # which retried green and so read as noise for weeks.
        run: |
          PHP_CLI_SERVER_WORKERS=10 php -S 127.0.0.1:8890 -t "$SITE_DIR" &> /tmp/php-server.log &
          sleep 2
          curl -sSf -o /dev/null "$SITE_URL/index.php"

      - name: Clean install of the built package
        # reset → build pkg_proclaim zip → install via Joomla's CLI → verify
        # extension registration, migrations, and the REST API assertions
        # (#1309/#1310/#1331 guards) — build/test-install.sh, unchanged.
        run: composer test:install

      - name: Accept the Proclaim licence for the disposable site
        # Proclaim's admin dispatcher redirects every view and task to the
        # licence screen until `license_accepted` is set, so on a site nobody
        # has clicked through, every admin spec lands on the same page and
        # fails looking for a field that is not there. That is what the first
        # run of this matrix showed: ten of twelve failures, all of them this.
        #
        # Done here rather than in test-install.sh on purpose. `composer
        # test:install` asserts what a *clean install* produces, and the gate
        # standing in the way is part of that — auto-accepting inside the
        # harness would hide a regression in the gate itself from the release
        # check that exists to catch one. Accepting it is a test-harness
        # action, so it lives with the test harness.
        run: |
          mysql -h 127.0.0.1 -u root -pjoomla_ci joomla_ci -e "
            UPDATE jos_extensions
               SET params = JSON_SET(IF(JSON_VALID(params), params, '{}'), '\$.license_accepted', '1')
             WHERE type = 'component' AND element = 'com_proclaim';"
          mysql -h 127.0.0.1 -u root -pjoomla_ci joomla_ci -N -e "
            SELECT JSON_EXTRACT(params, '\$.license_accepted')
              FROM jos_extensions
             WHERE type = 'component' AND element = 'com_proclaim';" | grep -q '"1"' \
            || { echo 'licence acceptance did not take'; exit 1; }

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E suite — API acceptance and the browser specs
        # ⚠️ One invocation, not one per project. global-setup.js recovers the
        # --project filter from argv to decide which sites need an admin
        # session, so separate runs repeat the whole setup and re-login for
        # each. Passing every project on one command line authenticates once.
        #
        # api-test is the #1330 spec: plugin visible in the admin UI,
        # 401-not-404 without a token, 200 + JSON:API with a token from the
        # admin profile, public_reads round-tripped through the edit form.
        #
        # The admin/site projects are the ten browser specs that until now ran
        # on one developer's laptop and nowhere else. They have real content to
        # work with: the install seeds a published study, a media file and a
        # template, and test:install seeds the site menus and a scripture
        # fixture on top.
        #
        # site-helium is deliberately absent. It needs a Gantry + Helium
        # install that exists on one local site only, and it pins a template
        # style by id that differs per site, so there is nothing for it to
        # assert against here.
        run: npx playwright test --project=api-test ${{ matrix.projects }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.props }}
          path: |
            build/reports/e2e
            test-results
          retention-days: 7

      - name: Upload PHP server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: php-server-log-${{ matrix.props }}
          path: /tmp/php-server.log
          retention-days: 7

      # Proclaim's own log, which the PHP server log does not contain: an
      # exception a component catches never reaches the server log at all --
      # the request answers 500 and the reason is gone. Diagnosing #2119 cost a
      # round trip for exactly that.
      #
      # ⚠️ Proclaim's four log files by name, not the whole logs directory.
      # This repository is public, so an artifact is downloadable by anyone for
      # as long as it is retained. The site it comes from is disposable -- built
      # from nothing in this run and destroyed with the runner -- but that is a
      # reason the contents are uninteresting, not a reason to collect more of
      # them than the job needs. Joomla's own logs, and anything another
      # extension writes beside them, are not this job's business.
      - name: Upload Proclaim's log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proclaim-log-${{ matrix.props }}
          path: ${{ env.SITE_DIR }}/administrator/logs/com_proclaim.*.php
          retention-days: 7
          if-no-files-found: ignore

  # A nightly nobody hears about is not a monitor. Until now the only thing a
  # scheduled failure produced was two artifacts on a page no one opens, so this
  # job failed on 2026-08-07 and again on 2026-08-08 without ever reaching a
  # human. A failure on a pull request is already visible on that pull request;
  # the scheduled run is the one with no audience, so only it opens an issue.
  #
  # One issue, reopened and updated rather than one per night, and closed
  # automatically when the job comes back green — the same shape vendor-check.yml
  # uses, so there is one pattern here rather than two.
  #
  # ⚠️ Its own job rather than a step on each matrix leg. Two legs reaching the
  # create step together would each find no open issue and each open one, which
  # is exactly the duplicate the label lookup below exists to prevent. Running
  # once after both legs keeps the "one issue" property that the matrix would
  # otherwise have quietly broken, and reports for the workflow rather than for
  # whichever leg happened to finish first.
  notify:
    name: Nightly failure issue
    needs: e2e
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or update the nightly failure issue
        if: needs.e2e.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: 'ci: nightly'
        run: |
          TITLE="Nightly E2E is failing"
          BODY="The scheduled E2E run failed on $(date -u +%Y-%m-%d).

          **Run:** $RUN_URL

          The run page shows which Joomla leg failed. The Playwright report and the
          PHP server log are attached to that run as artifacts, one set per leg,
          kept for 7 days. This issue is updated on each further failure and closed
          automatically once the nightly is green again.

          A red nightly does not block merges: E2E is deliberately not a required
          check, because its path filter means it does not report at all on most
          pull requests and a required check that never reports blocks them forever."

          # ⚠️ Both label names must exist in the repository. `gh issue create`
          # fails outright on an unknown one, and this call has no fallback, so
          # a typo here means the nightly silently has no audience at all —
          # which is what `bug` (the repo uses `type: bug`) and a then-missing
          # `ci: nightly` did until they were corrected.
          #
          # Found by label, not by title search. `--search "in:title …"` is fuzzy
          # — it matches a renamed or similarly-titled issue — and it reads
          # GitHub's search index, which lags creation by seconds to minutes. A
          # re-run or a manual dispatch landing inside that window would each
          # find nothing and open its own duplicate. --label queries the API
          # directly and is exact.
          NUM=$(gh issue list --repo "$REPO" --state open --label "$LABEL" --json number --jq '.[0].number // ""')

          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "Still failing on $(date -u +%Y-%m-%d): $RUN_URL"
          else
            gh issue create --repo "$REPO" \
              --title "$TITLE" \
              --label "$LABEL" \
              --label "type: bug" \
              --body "$BODY"
          fi

      - name: Close the nightly failure issue when green
        if: needs.e2e.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: 'ci: nightly'
        run: |
          NUM=$(gh issue list --repo "$REPO" --state open --label "$LABEL" --json number --jq '.[0].number // ""')

          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$REPO" \
              --comment "Nightly E2E passed on $(date -u +%Y-%m-%d): $RUN_URL. Closing automatically."
          fi
