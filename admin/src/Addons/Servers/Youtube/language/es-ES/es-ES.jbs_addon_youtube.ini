JBS_ADDON_YOUTUBE_SYNC_SETTINGS="Configuración de sincronización de YouTube"
JBS_ADDON_YOUTUBE_DESC_FORMAT="Formato de descripción"
JBS_ADDON_YOUTUBE_DESC_FORMAT_DESC="Plantilla para sincronizar descripciones con YouTube. Marcadores de posición disponibles: {introducción al estudio}, {capítulos}, {temas}, {escritura}, {profesor}, {serie}. Los saltos de línea son los mismos que los saltos de línea reales."
JBS_ADDON_YOUTUBE_DETAILS_DESC="Controla cómo se presenta este vídeo en las listas y en las vistas individuales: imagen en miniatura, estilo del botón de acción e icono. Deja cualquier campo en blanco para que se apliquen los valores predeterminados del servidor."
JBS_ADDON_YOUTUBE_PARAMETERS_DESC="Tamaño del reproductor, título y contenido del pie de página de la ventana emergente, y comportamiento de reproducción automática para el reproductor integrado. El margen de la ventana emergente es la distancia (en píxeles) entre la ventana emergente y el borde del navegador."
JBS_ADDON_YOUTUBE_EMBED_OPTIONS_DESC="Las opciones avanzadas del reproductor de YouTube se transfieren a la URL de inserción: silenciar, reproducir en bucle, subtítulos, visibilidad de los controles, vídeos relacionados y marcas de tiempo de inicio y fin. Cada campo, si se deja vacío, adopta la configuración predeterminada de la plataforma."
JBS_ADDON_YOUTUBE_LIVE_SETTINGS="Transmisión en vivo"
JBS_ADDON_YOUTUBE_STREAM_MODE="¿Cómo se transmite en directo a YouTube?"
JBS_ADDON_YOUTUBE_STREAM_MODE_DESC="Directo: tu codificador (OBS, hardware) transmite directamente a YouTube, y Proclaim puede crear y gestionar las transmisiones en directo. Externo: un servicio de retransmisión (Resi, Restream, etc.) crea la transmisión; Proclaim nunca creará una para este servidor."
JBS_ADDON_YOUTUBE_STREAM_MODE_EXTERNAL="Retransmisor externo"
JBS_ADDON_YOUTUBE_STREAM_MODE_DIRECT="Directo (gestionado por Proclaim)"
JBS_ADDON_YOUTUBE_LIVE_DEFAULT_PRIVACY="Privacidad de transmisión predeterminada"
JBS_ADDON_YOUTUBE_LIVE_DEFAULT_PRIVACY_DESC="Privacidad garantizada para las nuevas transmisiones en directo, salvo que se especifique lo contrario en el archivo multimedia. La opción predeterminada segura es "No listado": nada se hará público de forma inesperada."
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_PUBLIC="Público"
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_UNLISTED="No estante en la lista"
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_PRIVATE="Privado"
JBS_ADDON_YOUTUBE_LIVE_BROADCAST="Transmisión en vivo"
JBS_ADDON_YOUTUBE_LIVE_BROADCAST_NOTE="Crea una transmisión en vivo programada en YouTube para este sermón. La transmisión se programa para la fecha indicada en este registro, se titula según el estudio y su URL de visualización se convierte en la URL de este archivo multimedia. Requiere la conexión a la cuenta de YouTube del servidor."
JBS_ADDON_YOUTUBE_CREATE_LIVE_BROADCAST="Crear transmisión en vivo"
JBS_ADDON_YOUTUBE_CREATE_LIVE_BROADCAST_DESC="Crea una transmisión en vivo programada en YouTube cuando se guarde este archivo multimedia. Nunca será automático, solo cuando actives esta opción."
JBS_ADDON_YOUTUBE_LIVE_PRIVACY="Privacidad de la transmisión"
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_DESC="Privacidad para esta transmisión. La configuración predeterminada del servidor utiliza los ajustes de la configuración de transmisión en vivo del servidor."
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_SERVER_DEFAULT="Configuración predeterminada del servidor"
JBS_ADDON_YOUTUBE_LIVE_MISSING_INPUT="Una emisión necesita un título y una fecha de inicio programada; establezca la fecha de emisión y asegúrese de que el estudio tenga un título."
JBS_ADDON_YOUTUBE_LIVE_NOT_DIRECT="Este servidor está configurado para transmisión externa/retransmisión; el retransmisor es el propietario de la transmisión, por lo que Proclaim no creará una nueva. Cambie el modo de transmisión en vivo del servidor a directo si Proclaim debe gestionar las transmisiones."
JBS_ADDON_YOUTUBE_LIVE_OAUTH_REQUIRED="Se requiere una conexión a una cuenta de YouTube; active la autenticación OAuth en la configuración del servidor antes de crear transmisiones."
JBS_ADDON_YOUTUBE_LIVE_CONNECT_PROMPT="Las transmisiones en directo necesitan la conexión a la cuenta de YouTube de este servidor (OAuth) antes de poder crearse."
JBS_ADDON_YOUTUBE_LIVE_CONNECT_LINK="Conecta la cuenta de YouTube en la configuración del servidor."
