JBS_ADDON_YOUTUBE_LIVE_BIND_FAILED="The broadcast was created, but the ingestion stream could not be bound: %s You can bind it manually in YouTube Studio."
JBS_ADDON_YOUTUBE_STREAM_KEY_LABEL="Encoder Connection"
JBS_ADDON_YOUTUBE_STREAM_KEY_DESC="What your streaming encoder (OBS, hardware) points at. Provisioned automatically the first time Proclaim creates a live broadcast on this server, then reused for every broadcast — configure the encoder once."
JBS_ADDON_YOUTUBE_STREAM_KEY_PENDING="Not provisioned yet — the ingestion stream is created with the first live broadcast on this server."
