JBS_ADDON_YOUTUBE_DAILY_QUOTA_DESC="Tu límite diario de cuota de la API de datos de YouTube v3. El valor predeterminado es 10 000 para las nuevas claves de API. Tanto el sondeo del estado en tiempo real del frontend como la tarea de estadísticas de la plataforma comparten este presupuesto."
JBS_ADDON_YOUTUBE_QUOTA_RESET_HOUR="Hora de reinicio de cuota (UTC)"
JBS_ADDON_YOUTUBE_QUOTA_RESET_HOUR_DESC="Hora UTC en la que YouTube restablece la cuota diaria. YouTube se restablece a la medianoche (hora del Pacífico), que suele ser a las 7:00 u 8:00 UTC, según el horario de verano. Valor predeterminado: 7."
JBS_ADDON_YOUTUBE_OAUTH_SETTINGS="Autenticación OAuth 2.0 de YouTube"
JBS_ADDON_YOUTUBE_OAUTH_NOTE="Credenciales de OAuth"
JBS_ADDON_YOUTUBE_OAUTH_NOTE_DESC="Se requiere OAuth 2.0 para operaciones de escritura (sincronizar descripciones, descargar subtítulos). Crea credenciales en tu consola de Google Cloud, en API y servicios > Credenciales. Configura la URL de redirección autorizada con la URL de administración de tu sitio que termina en: /index.php?option=com_proclaim&task=cwmserver.youtubeOAuthCallback"
