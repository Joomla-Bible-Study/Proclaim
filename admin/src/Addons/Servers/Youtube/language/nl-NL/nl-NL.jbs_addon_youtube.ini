JBS_ADDON_YOUTUBE_DESC_FORMAT_DESC="Sjabloon voor het synchroniseren van beschrijvingen met YouTube. Beschikbare plaatsaanduidingen: {studyintro}, {chapters}, {topics}, {scripture}, {teacher}, {series}. Regeleinden worden weergegeven met echte nieuwe regels."
JBS_ADDON_YOUTUBE_DETAILS_DESC="Bepaal zelf hoe deze video wordt weergegeven in overzichten en individuele weergaven: miniatuurafbeelding, stijl van de actieknop en pictogram. Laat alle velden leeg om de algemene serverinstellingen over te nemen."
JBS_ADDON_YOUTUBE_PARAMETERS_DESC="Grootte van de speler, titel en inhoud van de pop-upvoet, en het autoplay-gedrag voor de ingebouwde speler. De marge van de pop-up is de afstand (in pixels) tussen de pop-up en de rand van de browser."
JBS_ADDON_YOUTUBE_EMBED_OPTIONS_DESC="Geavanceerde YouTube-spelerinstellingen die worden doorgegeven aan de insluit-URL: dempen, herhalen, ondertiteling, zichtbaarheid van bedieningselementen, gerelateerde video's en begin-/eindtijdstempels. Elk veld krijgt standaard de platforminstelling als het leeg wordt gelaten."
JBS_ADDON_YOUTUBE_LIVE_SETTINGS="Live streaming"
JBS_ADDON_YOUTUBE_STREAM_MODE="Hoe stream je naar YouTube?"
JBS_ADDON_YOUTUBE_STREAM_MODE_DESC="Direct: uw encoder (OBS, hardware) streamt rechtstreeks naar YouTube, en Proclaim kan de live-uitzendingen maken en beheren. Extern: een restreamingservice (Resi, Restream, enz.) maakt de uitzending aan — Proclaim zal nooit een uitzending voor deze server aanmaken."
JBS_ADDON_YOUTUBE_STREAM_MODE_EXTERNAL="Externe / restreamer"
JBS_ADDON_YOUTUBE_STREAM_MODE_DIRECT="Direct (beheer door Proclaim)"
JBS_ADDON_YOUTUBE_LIVE_DEFAULT_PRIVACY="Standaard uitzendprivacy"
JBS_ADDON_YOUTUBE_LIVE_DEFAULT_PRIVACY_DESC="Privacy voor nieuwe live-uitzendingen is standaard ingeschakeld, tenzij anders vermeld in het mediabestand. 'Niet openbaar' is de veilige standaardinstelling: niets wordt onverwachts openbaar."
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_PUBLIC="Openbaar"
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_UNLISTED="Niet vermeld"
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_PRIVATE="Privé"
JBS_ADDON_YOUTUBE_LIVE_BROADCAST="Live-uitzending"
JBS_ADDON_YOUTUBE_LIVE_BROADCAST_NOTE="Hiermee wordt een geplande live-uitzending op YouTube voor deze preek aangemaakt. De uitzending wordt gepland op de datum die bij dit mediabestand staat vermeld, krijgt dezelfde titel als de studie, en de URL om de uitzending te bekijken wordt de URL van dit mediabestand. Vereist een verbinding met het YouTube-account van de server."
JBS_ADDON_YOUTUBE_CREATE_LIVE_BROADCAST="Maak een live-uitzending"
JBS_ADDON_YOUTUBE_CREATE_LIVE_BROADCAST_DESC="Maak een geplande YouTube-livestream aan voor het moment dat dit mediabestand wordt opgeslagen. Nooit automatisch — alleen wanneer u deze optie inschakelt."
JBS_ADDON_YOUTUBE_LIVE_PRIVACY="Uitzendprivacy"
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_DESC="Privacyinstellingen voor deze uitzending. Serverstandaard gebruikt de instelling uit de livestreamingconfiguratie van de server."
JBS_ADDON_YOUTUBE_LIVE_PRIVACY_SERVER_DEFAULT="Serverstandaard"
JBS_ADDON_YOUTUBE_LIVE_MISSING_INPUT="Een uitzending heeft een titel en een geplande starttijd nodig — stel de uitzenddatum in en zorg ervoor dat het onderzoek een titel heeft."
JBS_ADDON_YOUTUBE_LIVE_NOT_DIRECT="Deze server is ingesteld op Externe/restreamer-streaming — de restreamer beheert de uitzending, dus Proclaim zal er geen aanmaken. Schakel de Live Streaming-modus van de server over naar Direct als Proclaim de uitzendingen moet beheren."
