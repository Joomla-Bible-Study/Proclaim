PLG_TASK_PROCLAIM_PUBLISH_TITLE="Prohlašujeme plánované publikování"
PLG_TASK_PROCLAIM_PUBLISH_DESC="Automaticky publikuje a ruší publikování zpráv a sérií na základě data jejich publikování a publikování. Doporučený interval: každých 5–15 minut."
PLG_TASK_PROCLAIM_PUBLISH_DOWN_ACTION_LABEL="Akce s vypršeným obsahem"
PLG_TASK_PROCLAIM_PUBLISH_DOWN_ACTION_DESC="Vyberte, co se stane s obsahem, jehož datum publikování uplynulo."
PLG_TASK_PROCLAIM_PUBLISH_ACTION_UNPUBLISH="Zrušit publikování"
PLG_TASK_PROCLAIM_PUBLISH_ACTION_ARCHIVE="Archiv"
PLG_TASK_PROCLAIM_PUBLISH_NOTE="Tato úloha kontroluje zprávy i série. Položky s datem publish_up v minulosti a stavem Nepublikováno budou nastaveny na Publikováno. Položky s datem publish_down v minulosti a stavem Publikováno budou nastaveny na akci vybranou výše. Doporučuje se interval úlohy 5–15 minut."
PLG_TASK_PROCLAIM_PUBLISH_SUCCESS="Plánované publikování: %d publikováno, %d vypršelo."
PLG_TASK_PROCLAIM_ANALYTICS_TITLE="Prohlásit souhrn analytických nástrojů"
PLG_TASK_PROCLAIM_ANALYTICS_DESC="Shromažďuje nezpracované analytické události do trvalých měsíčních agregátů a odstraňuje stará nezpracovaná data. Volitelně odesílá e-mailové reporty pro jednotlivé kampusy. Doporučený interval: denně."
PLG_TASK_PROCLAIM_ANALYTICS_SETTINGS="Nastavení analytických úloh"
PLG_TASK_PROCLAIM_ANALYTICS_ROLLUP_LABEL="Povolit souhrn"
PLG_TASK_PROCLAIM_ANALYTICS_ROLLUP_DESC="Agregujte nezpracované události starší než doba uchování do permanentní měsíční tabulky."
PLG_TASK_PROCLAIM_ANALYTICS_PURGE_LABEL="Povolit vyčištění"
PLG_TASK_PROCLAIM_ANALYTICS_PURGE_DESC="Smazat nezpracované události po jejich sehrnutí do měsíční agregační tabulky."
PLG_TASK_PROCLAIM_ANALYTICS_RETENTION_LABEL="Dny uchovávání"
PLG_TASK_PROCLAIM_ANALYTICS_RETENTION_DESC="Nezpracované události starší než tento počet dní budou shrnuty a smazány. Minimálně 7."
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_LABEL="Odeslat e-mailovou zprávu"
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_DESC="Odeslat e-mail s analýzou HTML pokaždé, když se tato úloha spustí."
PLG_TASK_PROCLAIM_ANALYTICS_REPORT_EMAIL_LABEL="Nahlásit e-mailovou adresu"
PLG_TASK_PROCLAIM_ANALYTICS_REPORT_EMAIL_DESC="E-mailová adresa pro zasílání analytických zpráv."
PLG_TASK_PROCLAIM_ANALYTICS_REPORT_DAYS_LABEL="Období hlášení (dny)"
PLG_TASK_PROCLAIM_ANALYTICS_REPORT_DAYS_DESC="Počet dní, které se mají zahrnout do e-mailové zprávy."
PLG_TASK_PROCLAIM_ANALYTICS_ROLLUP_SUCCESS="Souhrn analytických dat dokončen: %d řádků agregováno, %d nezpracovaných událostí odstraněno."
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_TITLE="Prohlašovat analytickou zprávu"
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_PERIOD="Období: %s až %s"
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_SUBJECT="Prohlašovat analytickou zprávu"
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_SENT="E-mail s analytickou zprávou odeslán na %s."
PLG_TASK_PROCLAIM_PLATFORMSTATS_TITLE="Prohlašovat synchronizaci statistik platformy"
PLG_TASK_PROCLAIM_PLATFORMSTATS_DESC="Načítá statistiky přehrávání videa z nakonfigurovaných externích video platforem (např. YouTube). Frekvence plánování: doporučuje se denně."
PLG_TASK_PROCLAIM_PLATFORMSTATS_SETTINGS="Nastavení statistik platformy"
PLG_TASK_PROCLAIM_PLATFORMSTATS_NOTE="Tato úloha synchronizuje statistiky ze všech serverů video platformy, které mají nakonfigurované přihlašovací údaje API. Dotazy budou odesílány pouze na servery s platnými klíči/tokeny API. Používá dávkové zpracování, aby se dodržely limity rychlosti API – všechna videa se synchronizují postupně v průběhu po sobě jdoucích spuštění."
PLG_TASK_PROCLAIM_PLATFORMSTATS_BATCH_LABEL="Velikost dávky na server"
PLG_TASK_PROCLAIM_PLATFORMSTATS_BATCH_DESC="Maximální počet videí k synchronizaci na server na jedno spuštění úlohy. Nižší hodnoty snižují využití API; vyšší hodnoty se synchronizují rychleji. Prioritu mají nikdy nesynchronizovaná a nejstarší synchronizovaná videa. Výchozí hodnota: 50."
PLG_TASK_PROCLAIM_PLATFORMSTATS_NO_SERVERS="Nebyly nalezeny žádné servery s podporou statistik. Nakonfigurujte video server (např. YouTube) s přihlašovacími údaji API."
PLG_TASK_PROCLAIM_PLATFORMSTATS_RESULT="Synchronizace statistik platformy dokončena: Synchronizováno %d videí, chyb %d."
PLG_TASK_PROCLAIM_PLATFORMSTATS_REMAINING="Zbývající videa k synchronizaci napříč všemi servery: %d (bude pokračovat při dalším spuštění)."
PLG_TASK_PROCLAIM_PLATFORMSTATS_CACHE_SCRUB="Vyčištění mezipaměti YouTube: %d souborů s prošlou platností odstraněno, %d souborů ponecháno."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_TITLE="Prohlašujeme synchronizaci playlistů YouTube"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DESC="Udržuje již importované playlisty YouTube v souladu s kanálem (názvy, videa, odstranění) a porovnává videa s existujícími médii. Frekvence plánování: doporučuje se denně."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_SETTINGS="Nastavení synchronizace playlistů"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_NOTE="Před naplánováním této úlohy spusťte v Seznamech skladeb alespoň jednou akci „Importovat z YouTube“. Ve výchozím nastavení se obnovují pouze seznamy skladeb, které jste již importovali, a nikdy se nevytvářejí nové bez dozoru. Lokální úpravy provedené od poslední synchronizace se zachovají, nikoli se přepíší."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_SERVER_LABEL="ID serveru"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_SERVER_DESC="Server YouTube, který se má synchronizovat, nebo 0 pro synchronizaci všech publikovaných serverů YouTube."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DISCOVER_LABEL="Objevte nové playlisty"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DISCOVER_DESC="Pokud je tato funkce povolena, vytvoří také seznamy skladeb Proclaim pro seznamy skladeb kanálů, které dosud nebyly importovány. Pokud chcete, aby byl počáteční import záměrně ručním krokem, nechte tuto funkci vypnutou."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_RESULT="Synchronizace playlistu dokončena: %1$d vytvořeno, %2$d aktualizováno, %3$d shodných videí, %4$d dosud není v knihovně."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_SKIPPED="%d playlistů kanálu bylo přeskočeno (zatím nebyly importovány nebo synchronizace byla zakázána). Pro přidání nových použijte možnost „Importovat z YouTube“."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_PUSH_LABEL="Odeslat lokální změny"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_PUSH_DESC="Pokud je tato možnost povolena, seznamy videí mají přihlášené k zpětnému zápisu a odesílají změny zpět na platformu (YouTube): lokálně upravené tituly a videa z propojeného seriálu přidáná do seznamu videí, pokud chybí. Vyžaduje OAuth na serveru."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DRYRUN_LABEL="Zkušební provoz"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DRYRUN_DESC="Zobrazit náhled titulů, které by byly odeslány bez zápisu na platformu. Zaznamenáno k revizi."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_PUSHED="Na platformu bylo odesláno %d titulů playlistu."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DESC_PUSHED="Na platformu bylo odesláno %d popisů playlistů."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_MEMBERS_PUSHED="%d videa přidána do playlistů na platformě."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_MEMBERS_REMOVED="%d videa odstraněna z playlistů na platformě."
