PLG_TASK_PROCLAIM_PUBLISH_TITLE="Publicación programada de Proclaim"
PLG_TASK_PROCLAIM_PUBLISH_DESC="Publica y cancela automáticamente mensajes y series según sus fechas de publicación y de baja. Intervalo recomendado: cada 5-15 minutos."
PLG_TASK_PROCLAIM_PUBLISH_DOWN_ACTION_LABEL="Acción de contenido caducado"
PLG_TASK_PROCLAIM_PUBLISH_DOWN_ACTION_DESC="Elija qué sucede con el contenido cuya fecha de publicación ha pasado."
PLG_TASK_PROCLAIM_PUBLISH_ACTION_UNPUBLISH="Anular publicación"
PLG_TASK_PROCLAIM_PUBLISH_ACTION_ARCHIVE="Archivo"
PLG_TASK_PROCLAIM_PUBLISH_NOTE="Esta tarea revisa tanto los mensajes como las series. Los elementos con fecha de publicación anterior y estado "No publicado" se configurarán como "Publicados". Los elementos con fecha de publicación anterior y estado "Publicados" se configurarán como "Publicados". Se recomienda un intervalo de 5 a 15 minutos entre cada tarea."
PLG_TASK_PROCLAIM_PUBLISH_SUCCESS="Publicación programada: %d publicadas, %d expiradas."
PLG_TASK_PROCLAIM_ANALYTICS_TITLE="Paquete acumulativo de análisis de Proclaim"
PLG_TASK_PROCLAIM_ANALYTICS_DESC="Agrupa los eventos de análisis sin procesar en agregados mensuales permanentes y elimina los datos sin procesar antiguos. Opcionalmente, envía informes por correo electrónico a cada campus. Intervalo recomendado: diario."
PLG_TASK_PROCLAIM_ANALYTICS_SETTINGS="Configuración de tareas de análisis"
PLG_TASK_PROCLAIM_ANALYTICS_ROLLUP_LABEL="Habilitar Rollup"
PLG_TASK_PROCLAIM_ANALYTICS_ROLLUP_DESC="Agregue eventos sin procesar más antiguos que el período de retención en la tabla mensual permanente."
PLG_TASK_PROCLAIM_ANALYTICS_PURGE_LABEL="Habilitar purga"
PLG_TASK_PROCLAIM_ANALYTICS_PURGE_DESC="Eliminar eventos sin procesar después de haberlos incluido en la tabla agregada mensual."
PLG_TASK_PROCLAIM_ANALYTICS_RETENTION_LABEL="Días de retención"
PLG_TASK_PROCLAIM_ANALYTICS_RETENTION_DESC="Los eventos sin procesar con más de este número de días se agruparán y eliminarán. Mínimo 7."
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_LABEL="Enviar informe por correo electrónico"
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_DESC="Envía un correo electrónico con un resumen analítico en HTML cada vez que se ejecuta esta tarea."
PLG_TASK_PROCLAIM_ANALYTICS_REPORT_EMAIL_LABEL="Informar dirección de correo electrónico"
PLG_TASK_PROCLAIM_ANALYTICS_REPORT_EMAIL_DESC="Dirección de correo electrónico para recibir el informe analítico."
PLG_TASK_PROCLAIM_ANALYTICS_REPORT_DAYS_LABEL="Periodo del informe (días)"
PLG_TASK_PROCLAIM_ANALYTICS_REPORT_DAYS_DESC="Número de días a incluir en el informe por correo electrónico."
PLG_TASK_PROCLAIM_ANALYTICS_ROLLUP_SUCCESS="Resumen de análisis completo: %d filas agregadas, %d eventos sin procesar purgados."
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_TITLE="Informe de análisis de Proclaim"
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_PERIOD="Periodo: %s a %s"
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_SUBJECT="Informe de análisis de Proclaim"
PLG_TASK_PROCLAIM_ANALYTICS_EMAIL_SENT="Correo electrónico con informe analítico enviado a %s."
PLG_TASK_PROCLAIM_PLATFORMSTATS_TITLE="Sincronización de estadísticas de la plataforma Proclaim"
PLG_TASK_PROCLAIM_PLATFORMSTATS_DESC="Obtiene estadísticas de reproducción de vídeo de plataformas externas configuradas (p. ej., YouTube). Frecuencia de programación: se recomienda una frecuencia diaria."
PLG_TASK_PROCLAIM_PLATFORMSTATS_SETTINGS="Configuración de estadísticas de la plataforma"
PLG_TASK_PROCLAIM_PLATFORMSTATS_NOTE="Esta tarea sincroniza las estadísticas de todos los servidores de plataformas de vídeo que tengan credenciales de API configuradas. Solo se consultarán los servidores con claves/tokens de API válidos. Utiliza el procesamiento por lotes para cumplir con los límites de velocidad de la API: todos los vídeos se sincronizan gradualmente en ejecuciones sucesivas."
PLG_TASK_PROCLAIM_PLATFORMSTATS_BATCH_LABEL="Tamaño de lote por servidor"
PLG_TASK_PROCLAIM_PLATFORMSTATS_BATCH_DESC="Número máximo de vídeos a sincronizar por servidor y tarea ejecutada. Los valores bajos reducen el uso de la API; los valores altos aceleran la sincronización. Se priorizan los vídeos nunca sincronizados y los más antiguos. Valor predeterminado: 50."
PLG_TASK_PROCLAIM_PLATFORMSTATS_NO_SERVERS="No se encontraron servidores con capacidad para estadísticas. Configure un servidor de vídeo (p. ej., YouTube) con credenciales de API."
PLG_TASK_PROCLAIM_PLATFORMSTATS_RESULT="Sincronización de estadísticas de la plataforma completa: %d vídeos sincronizados, %d errores."
PLG_TASK_PROCLAIM_PLATFORMSTATS_REMAINING="Vídeos restantes para sincronizar en todos los servidores: %d (continuarán en la próxima ejecución)."
PLG_TASK_PROCLAIM_PLATFORMSTATS_CACHE_SCRUB="Limpieza de caché de YouTube: %d archivos caducados eliminados, %d archivos conservados."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_TITLE="Sincronización de listas de reproducción de YouTube de Proclaim"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DESC="Mantiene sincronizadas las listas de reproducción de YouTube ya importadas con el canal (títulos, vídeos, eliminaciones) y concilia los vídeos con el contenido multimedia existente. Frecuencia de programación: se recomienda diariamente."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_SETTINGS="Configuración de sincronización de listas de reproducción"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_NOTE="Ejecuta la acción "Importar desde YouTube" en Listas de reproducción al menos una vez antes de programar esta tarea. Por defecto, solo actualiza las listas de reproducción que ya has importado y nunca crea nuevas automáticamente. Las ediciones locales realizadas desde la última sincronización se conservan en lugar de sobrescribirse."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_SERVER_LABEL="ID del servidor"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_SERVER_DESC="El servidor de YouTube que se va a sincronizar, o 0 para sincronizar todos los servidores de YouTube publicados."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DISCOVER_LABEL="Descubre nuevas listas de reproducción"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DISCOVER_DESC="Cuando está habilitada, la tarea también crea listas de reproducción de Proclaim para las listas de reproducción de canales que aún no se han importado. Desactive esta opción para que la importación inicial siga siendo un paso manual."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_RESULT="Sincronización de la lista de reproducción completada: %1$d creada, %2$d actualizada, %3$d vídeos coincidentes, %4$d aún no están en la biblioteca."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_SKIPPED="Se omitieron %d listas de reproducción del canal (aún no se han importado o la sincronización está desactivada). Usa "Importar desde YouTube" para añadir nuevas."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_PUSH_LABEL="Impulsar cambios locales"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_PUSH_DESC="Cuando está habilitada, las listas de reproducción que optaron por guardar los cambios envíanlos de vuelta a la plataforma (YouTube): los títulos editados localmente y los videos de una serie vinculada se agregan a la lista de reproducción si faltan. Requiere OAuth en el servidor."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DRYRUN_LABEL="Ensayo general"
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DRYRUN_DESC="Previsualiza qué títulos se publicarán sin necesidad de escribir en la plataforma. Registrado para su revisión."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_PUSHED="%d títulos de listas de reproducción enviados a la plataforma."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_DESC_PUSHED="%d descripción(es) de la lista de reproducción enviada(s) a la plataforma."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_MEMBERS_PUSHED="%d vídeos añadidos a las listas de reproducción de la plataforma."
PLG_TASK_PROCLAIM_PLAYLISTSYNC_MEMBERS_REMOVED="%d vídeo(s) eliminados de las listas de reproducción en la plataforma."
