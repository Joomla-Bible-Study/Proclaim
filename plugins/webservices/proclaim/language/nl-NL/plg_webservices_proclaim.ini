PLG_WEBSERVICES_PROCLAIM="Proclaim - Webdiensten"
PLG_WEBSERVICES_PROCLAIM_DESCRIPTION="Biedt toegang tot de REST API van Proclaim. Door deze plugin in te schakelen, wordt de API geactiveerd; door hem uit te schakelen, wordt de API gedeactiveerd. Lezen vereist een API-token, tenzij u hieronder openbare leesbewerkingen toestaat. Schrijven vereist altijd een token."
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_LABEL="Openbare lezing toestaan"
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_DESC="Wanneer deze optie is ingeschakeld, is er geen API-token nodig voor GET-verzoeken. De inhoud blijft echter beperkt tot wat een gast kan bekijken, dus beperkte items worden nooit geretourneerd. Voor het aanmaken, bijwerken en verwijderen van items is altijd een token vereist. Laat deze optie uitgeschakeld, tenzij u van plan bent een openbare feed te publiceren."
