PLG_WEBSERVICES_PROCLAIM="Proclaim - Web Services"
PLG_WEBSERVICES_PROCLAIM_DESCRIPTION="Provides Proclaim's REST API. Enabling this plugin turns the API on; disabling it turns the API off. Reads require an API token unless you allow public reads below. Writes always require a token."
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_LABEL="Allow public reads"
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_DESC="When enabled, GET requests do not require an API token. Content is still limited to what a guest may view, so restricted items are never returned. Creating, updating and deleting always require a token. Leave disabled unless you intend to publish an open feed."
