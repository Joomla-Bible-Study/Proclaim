PLG_WEBSERVICES_PROCLAIM="Prohlašovat - webové služby"
PLG_WEBSERVICES_PROCLAIM_DESCRIPTION="Poskytuje REST API rozhraní Proclaim. Povolení tohoto pluginu API zapne; jeho zakázání API vypne. Čtení vyžaduje token API, pokud níže nepovolíte veřejné čtení. Zápisy vždy vyžadují token."
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_LABEL="Povolit veřejné čtení"
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_DESC="Pokud je povoleno, požadavky GET nevyžadují token API. Obsah je stále omezen na to, co si host může prohlížet, takže položky s omezeným přístupem se nikdy nevrací. Vytváření, aktualizace a mazání vždy vyžadují token. Pokud nemáte v úmyslu publikovat otevřený kanál, ponechte tuto možnost vypnutou."
