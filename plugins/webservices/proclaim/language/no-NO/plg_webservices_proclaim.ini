PLG_WEBSERVICES_PROCLAIM="Proklamer - Nettjenester"
PLG_WEBSERVICES_PROCLAIM_DESCRIPTION="Tilbyr Proclaims REST API. Aktivering av denne plugin-modulen slår API-et på; deaktivering slår API-et av. Lesinger krever et API-token med mindre du tillater offentlige lesinger nedenfor. Skrivinger krever alltid et token."
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_LABEL="Tillat offentlig lesing"
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_DESC="Når GET-forespørsler er aktivert, krever de ikke et API-token. Innholdet er fortsatt begrenset til hva en gjest kan se, så begrensede elementer returneres aldri. Oppretting, oppdatering og sletting krever alltid et token. La dette være deaktivert med mindre du har tenkt å publisere en åpen feed."
