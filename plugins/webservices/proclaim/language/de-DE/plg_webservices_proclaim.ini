PLG_WEBSERVICES_PROCLAIM="Proclaim – Webdienste"
PLG_WEBSERVICES_PROCLAIM_DESCRIPTION="Stellt die REST-API von Proclaim bereit. Durch Aktivieren dieses Plugins wird die API eingeschaltet; durch Deaktivieren wird sie deaktiviert. Lesezugriffe erfordern ein API-Token, sofern Sie öffentliche Lesezugriffe nicht weiter unten zulassen. Schreibzugriffe erfordern immer ein Token."
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_LABEL="Öffentliches Lesen zulassen"
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_DESC="Wenn diese Option aktiviert ist, benötigen GET-Anfragen kein API-Token. Der Inhalt ist weiterhin auf die für Gäste sichtbaren Inhalte beschränkt, daher werden eingeschränkte Elemente niemals zurückgegeben. Zum Erstellen, Aktualisieren und Löschen ist immer ein Token erforderlich. Lassen Sie diese Option deaktiviert, es sei denn, Sie möchten einen öffentlichen Feed veröffentlichen."
