PLG_WEBSERVICES_PROCLAIM="Proclaim - Servicios web"
PLG_WEBSERVICES_PROCLAIM_DESCRIPTION="Proporciona la API REST de Proclaim. Al habilitar este complemento, se activa la API; al deshabilitarlo, se desactiva. Las lecturas requieren un token de API, a menos que permita lecturas públicas más abajo. Las escrituras siempre requieren un token."
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_LABEL="Permitir lecturas públicas"
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_DESC="Cuando está habilitada, las solicitudes GET no requieren un token de API. El contenido sigue limitado a lo que un invitado puede ver, por lo que los elementos restringidos nunca se muestran. Crear, actualizar y eliminar siempre requieren un token. Déjela deshabilitada a menos que tenga la intención de publicar un feed abierto."
