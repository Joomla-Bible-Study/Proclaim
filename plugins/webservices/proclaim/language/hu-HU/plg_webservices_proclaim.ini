PLG_WEBSERVICES_PROCLAIM="Kihirdetjük - Webszolgáltatások"
PLG_WEBSERVICES_PROCLAIM_DESCRIPTION="Biztosítja a Proclaim REST API-ját. A bővítmény engedélyezése bekapcsolja az API-t; letiltása kikapcsolja. Az olvasáshoz API-token szükséges, kivéve, ha alább engedélyezi a nyilvános olvasásokat. Az íráshoz mindig token szükséges."
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_LABEL="Nyilvános olvasás engedélyezése"
PLG_WEBSERVICES_PROCLAIM_PUBLIC_READS_DESC="Engedélyezett állapotban a GET kérésekhez nincs szükség API tokenre. A tartalom továbbra is csak arra korlátozódik, hogy mit tekinthet meg egy vendég, így a korlátozott elemek soha nem kerülnek visszaadásra. Létrehozáshoz, frissítéshez és törléshez mindig token szükséges. Hagyja letiltva, kivéve, ha nyílt hírfolyamot kíván közzétenni."
